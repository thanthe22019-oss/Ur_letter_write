scene:
  frame_id: base_link
  world_name: empty

  # The floor already exists in Gazebo's empty.sdf world. It is repeated here
  # only so MoveIt has the same collision boundary.
  floor:
    pose: [0.0, 0.0, -0.01, 0.0, 0.0, 0.0]
    size: [2.0, 2.0, 0.02]
    color: [0.45, 0.45, 0.45, 1.0]

  table:
    pose: [0.31, 0.0, 0.14, 0.0, 0.0, 0.0]
    size: [0.44, 0.48, 0.04]
    color: [0.42, 0.25, 0.10, 1.0]

  objects:
    red_cube:
      pose: [0.20, 0.18, 0.18, 0.0, 0.0, 0.0]
      size: [0.04, 0.04, 0.04]
      color: [0.90, 0.05, 0.05, 1.0]
    yellow_cube:
      pose: [0.20, 0.06, 0.18, 0.0, 0.0, 0.0]
      size: [0.04, 0.04, 0.04]
      color: [0.95, 0.80, 0.05, 1.0]
    blue_cube:
      pose: [0.20, -0.06, 0.18, 0.0, 0.0, 0.0]
      size: [0.04, 0.04, 0.04]
      color: [0.05, 0.20, 0.90, 1.0]

  # Zones are visual targets, not collision geometry. Their upper surface is
  # level with the table so cubes can later be placed inside them.
  zones:
    zone_a:
      pose: [0.32, 0.18, 0.159, 0.0, 0.0, 0.0]
      size: [0.09, 0.09, 0.002]
      color: [0.90, 0.20, 0.20, 0.55]
    zone_b:
      # Offset from the table centre so the UR3e can approach vertically
      # without its upper arm crossing the table or the remaining cubes.
      pose: [0.32, 0.06, 0.159, 0.0, 0.0, 0.0]
      size: [0.09, 0.09, 0.002]
      color: [0.95, 0.80, 0.10, 0.55]
    zone_c:
      pose: [0.32, -0.06, 0.159, 0.0, 0.0, 0.0]
      size: [0.09, 0.09, 0.002]
      color: [0.15, 0.35, 0.95, 0.55]
