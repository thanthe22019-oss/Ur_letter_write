/**:
  ros__parameters:
    # MoveIt names from the Universal Robots SRDF.
    planning_group: ur_manipulator
    base_frame: base_link
    end_effector_link: tool0
    controller_action: /joint_trajectory_controller/follow_joint_trajectory
    controller_wait_seconds: 60.0

    # The letter lies in a vertical YZ plane. plane_x is its distance from
    # the robot base. The tool is lifted toward the robot by pen_lift.
    plane_x: 0.30
    center_y: 0.00
    center_z: 0.12
    letter_width: 0.10
    letter_height: 0.14
    pen_lift: 0.03

    # A fixed tool orientation: tool0's +Z axis points toward +X.
    orientation_x: 0.0
    orientation_y: 0.70710678
    orientation_z: 0.0
    orientation_w: 0.70710678

    # Cartesian planning and trajectory timing.
    curve_points: 24
    eef_step: 0.005
    # MoveIt's relative jump filter can reject a smooth short path because it
    # compares each step with that path's average. We instead apply the fixed
    # per-joint limit below to every generated trajectory point.
    jump_threshold: 0.0
    max_joint_step: 0.20
    # The shortest collision-free approach normally needs about 5.0 rad of
    # accumulated travel at one wrist joint. Keep enough margin for planner
    # interpolation while still rejecting an unwanted full 2*pi revolution.
    max_joint_travel: 5.5
    # Generate several collision-checked approach plans and execute the one
    # with the least total joint motion.
    approach_planning_attempts: 5
    minimum_path_fraction: 0.995
    velocity_scaling: 0.10
    acceleration_scaling: 0.10
    planning_time: 10.0

    # Delay after MoveIt is ready so the intended letter can be seen in RViz.
    preview_seconds: 2.0

    # Collision floor used by MoveIt during the initial approach.
    ground_z: 0.0
    ground_thickness: 0.02
